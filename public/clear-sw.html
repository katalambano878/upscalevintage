<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clearing local cache…</title>
  </head>
  <body>
    <p>Clearing cached files so the new storefront can load…</p>
    <script>
      Promise.all([
        navigator.serviceWorker
          ? navigator.serviceWorker.getRegistrations().then((regs) =>
              Promise.all(regs.map((reg) => reg.unregister()))
            )
          : Promise.resolve(),
        window.caches
          ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          : Promise.resolve(),
      ]).finally(function () {
        window.location.replace('/?fresh=' + Date.now());
      });
    </script>
  </body>
</html>
